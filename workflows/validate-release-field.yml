name: Validate PR
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check PR body
        id: check
        run: |
          PR_BODY=$(jq -r '.pull_request.body' "$GITHUB_EVENT_PATH")
          echo "Pull Request Body:"
          echo "$PR_BODY"
          
          # Check for unchecked checkbox
          if [[ "$PR_BODY" != *"- [x] I confirmed the next release version."* ]]; then
            echo "::error::Checkbox 'I confirmed the next release version' is not checked."
            exit 1
          fi

          # Check for version placeholder
          VERSION_PLACEHOLDER="VERSION_PLACEHOLDER"
          if [[ "$PR_BODY" == *"$VERSION_PLACEHOLDER"* ]]; then
            echo "::error::'VERSION_PLACEHOLDER' has not been replaced with a version number."
            exit 1
          fi
